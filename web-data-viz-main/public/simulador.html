<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/check.css">
    <link rel="stylesheet" href="./assets/fonts/fonts.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
    <title>Checklist</title>
</head>
<body>

     <header class="menu">
        <span class="menu-logo">Clube Delas</span>

        <nav class="menu-links">
            <a href="simulador.html">To Do List</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="index.html" class="menu-sair">Sair</a>
            
        </nav>
    </header>
    
    <h1 class="titulo">Checklist</h1>

    <input type="text" id="ipt_habito" class="campo" placeholder="Digite um hábito">

    <button onclick="adicionar()" class="botao">Adicionar hábito</button>

    <div id="div_exibir" class="lista"></div>

</body>
</html>
<script>
    let lista = [];

    function adicionar() {

    let habito = (ipt_habito.value);

    if (habito == "") {
        alert("Digite um hábito!");
    } else {

        lista.push(habito);

        habito = "";

        div_exibir.innerHTML = "";

        for (let i = 0; i < lista.length; i++) {

            div_exibir.innerHTML += `<input type="checkbox" id="check${i}"> ${lista[i]}<br>`;
        }
    }
}
</script>
