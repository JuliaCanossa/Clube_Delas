<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/auth.css">
    <title>Clube Delas | Cadastro</title>
</head>

<body>

    <section class="lado-azul">
        <span class="logo">Clube Delas</span>
        <h1>Um espaço para <span>ser você.</span></h1>
        <p>
            Pequenos hábitos, novas experiências e uma comunidade
            de meninas que querem crescer juntas.
        </p>
    </section>

    <section class="lado-claro">

        <div class="formulario">
            <h2>Faça parte!</h2>
            <p class="subtitulo">Crie sua conta e venha para o Clube Delas.</p>

            <input type="text" id="ipt_cad_nome" placeholder="Nome">
            <input type="email" id="ipt_cad_email" placeholder="E-mail">
            <input type="password" id="ipt_cad_senha" placeholder="Senha">
            <input type="password" id="ipt_cad_confirmar" placeholder="Confirmar senha">

            <button onclick="cadastrar()">CRIAR CONTA</button>

            <div id="div_exibir"></div>

            <p>
                Já tem conta?
                <a href="login.html">Entrar</a>
            </p>
        </div>

    </section>

    <script src="js/cadastro.js"></script>

</body>

</html>
<script>
 function cadastrar() {
    let nomeVar = (ipt_cad_nome.value);
    let emailVar = (ipt_cad_email.value);
    let senhaVar = (ipt_cad_senha.value);
    let confirmarVar = (ipt_cad_confirmar.value);

    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmarVar == "") {
        div_exibir.innerHTML = "Preencha todos os campos";

    } else if (senhaVar != confirmarVar) {
        div_exibir.innerHTML = "As senhas não são iguais";

    } else {

        fetch("/usuarios/cadastrar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                nomeServer: nomeVar,
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {

            if (resposta.ok) {
                div_exibir.innerHTML = "Conta criada! Redirecionando para o login...";

                setTimeout(function () {
                    window.location = "login.html";
                }, 2000);
            } else {
                div_exibir.innerHTML = "Não foi possível criar a conta. Tente novamente.";
            }

        }).catch(function (erro) {
            console.log("#ERRO: ", erro);
            div_exibir.innerHTML = "Erro de conexão com o servidor.";
        });
    }
}
